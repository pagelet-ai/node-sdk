name: Publish SDK

on:
  push:
    tags:
      - sdk-v*

permissions:
  contents: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org
      - name: Match the release tag to the package version
        run: test "$GITHUB_REF_NAME" = "sdk-v$(node -p 'require("./package.json").version')"
      - run: npm publish
